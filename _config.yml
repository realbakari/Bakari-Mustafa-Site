# Site settings
title: Bakari Mustafa # site title
description: >- # site description
  Bakari Mustafa is a Brisbane-based founder and technologist. He founded Mentors Outreach, mentoring program management software, and builds digital tools for Dzaleka Refugee Camp and African-Australian communities.
lang: en-US # default lang
timezone: Asia/Jakarta # set your timezone
image: uploads/bakari_mustafa.jpg # This image used for Open Graph more info https://ogp.me/
repo:  # site repo [optional]
mode: light # default theme "dark" | "light"

# Profile settings
author:
  name: Bakari Mustafa # author name
  bio: >- # tell to the world
    Entrepreneur, Technologist & Innovator
  username: realbakari # general username
  github: realbakari # github username
  twitter: realbakari # twitter username
  facebook: therealbakari # facebook username
  email: bakari@bakarimustafa.com # email adress
  avatar: /uploads/bakari_mustafa.jpg # change with your own avatar

# URL settings
url: "https://bakarimustafa.com/" #
baseurl:
permalink: /:title/
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _data
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec
  # Tooling: Netlify reads these from the repo, so they don't belong in the site.
  - scripts
  - scraper
  - netlify
  - netlify.toml
  - package.json
  - package-lock.json
  - skills-lock.json

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
