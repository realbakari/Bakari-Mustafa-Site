# Generated by scripts/takumi-commands.rb from Takumi's ABOUT blocks. Don't edit by hand.
---
- group: app
  about: 'Apps: get, remove, defaults, web apps, Windows'
  commands:
  - name: close-all
    summary: Close every window, as each one's close button would; asks first
    risk: '1'
  - name: default
    examples:
    - takumi app default browser chromium
    - takumi app default
    summary: 'Show or choose the default apps: browser, mail, terminal, editor, PDFs,
      images, video, music and files'
    usage: "[<browser|mail|terminal|editor|pdf|images|video|music|files> [app]] [--json]"
    risk: '0'
  - name: get
    examples:
    - takumi app get org.videolan.VLC VLC
    summary: 'Get an app from the Shelf: from Flathub, just for you, or a site as
      a web app'
    usage: "<flathub id or web address> [name]"
    risk: '1'
  - name: login
    examples:
    - takumi app login Spotify on
    summary: Choose the apps that open when you log in
    usage: "[<app> on|off]"
    risk: '0'
  - name: open
    examples:
    - takumi app open browser
    - takumi app open terminal btop
    summary: Open the browser, files, terminal or another app you chose, in a new
      window
    usage: "<browser|mail|terminal|editor|pdf|images|video|music|files> [file, link
      or command...]"
    risk: '0'
  - name: quit
    examples:
    - takumi app quit Spotify
    - takumi app quit firefox --restart
    summary: Force a stuck app to quit, or quit it and open it again; with no app,
      list the apps that have windows
    usage: "[<app> [--restart]]"
    risk: '1'
  - name: remove
    examples:
    - takumi app remove com.spotify.Client
    summary: 'Remove an app: one from Flathub, a web app, Windows, or an app installed
      apart from Takumi'
    usage: "<app id, package or name>"
    risk: '1'
  - name: web
    examples:
    - takumi app web https://web.whatsapp.com WhatsApp
    summary: 'Make a web app: a site in its own window, with its own icon, found in
      the Core like any app'
    usage: "<address> [name]"
    risk: '0'
  - name: web-remove
    examples:
    - takumi app web-remove whatsapp
    summary: Remove a web app made with takumi app web
    usage: "<name>"
    risk: '1'
