<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor - Multi-Language Support</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: #252526;
            padding: 15px 20px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .header h1 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-right: auto;
        }

        .header select,
        .header button {
            background: #3c3c3c;
            color: #cccccc;
            border: 1px solid #555555;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header select:hover,
        .header button:hover {
            background: #4e4e4e;
            border-color: #666666;
        }

        .header select:focus,
        .header button:focus {
            outline: 1px solid #007acc;
            outline-offset: -1px;
        }

        .header label {
            color: #cccccc;
            font-size: 13px;
            font-weight: 500;
        }

        .editor-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #editor {
            flex: 1;
            position: relative;
        }

        .output-panel {
            width: 350px;
            background: #1e1e1e;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .output-header {
            background: #252526;
            padding: 10px 15px;
            border-bottom: 1px solid #3e3e42;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }

        .output-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .output-content pre {
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-log {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 3px;
            background: #252526;
        }

        .output-log.error {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            border-left: 3px solid #f44336;
        }

        .output-log.success {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            border-left: 3px solid #4caf50;
        }

        .output-log.info {
            background: rgba(33, 150, 243, 0.1);
            color: #2196f3;
            border-left: 3px solid #2196f3;
        }

        .button-primary {
            background: #0e639c !important;
            color: #ffffff !important;
        }

        .button-primary:hover {
            background: #1177bb !important;
        }

        .button-success {
            background: #16825d !important;
            color: #ffffff !important;
        }

        .button-success:hover {
            background: #1a9e6f !important;
        }

        .button-danger {
            background: #c5000b !important;
            color: #ffffff !important;
        }

        .button-danger:hover {
            background: #e00012 !important;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .editor-wrapper {
                flex-direction: column;
            }

            .output-panel {
                width: 100%;
                height: 250px;
                border-left: none;
                border-top: 1px solid #3e3e42;
            }

            .header {
                padding: 10px 15px;
            }

            .header h1 {
                font-size: 16px;
            }
        }

        /* Loading screen */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #3e3e42;
            border-top-color: #007acc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #cccccc;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading Code Editor...</div>
    </div>

    <div class="container" style="display: none;" id="main-container">
        <div class="header">
            <h1>💻 Code Editor</h1>

            <label for="language-select">Language:</label>
            <select id="language-select">
                <option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="python">Python</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="json">JSON</option>
                <option value="markdown">Markdown</option>
                <option value="sql">SQL</option>
                <option value="yaml">YAML</option>
                <option value="shell">Shell/Bash</option>
                <option value="php">PHP</option>
                <option value="ruby">Ruby</option>
                <option value="go">Go</option>
                <option value="rust">Rust</option>
                <option value="java">Java</option>
                <option value="csharp">C#</option>
                <option value="cpp">C++</option>
            </select>

            <label for="theme-select">Theme:</label>
            <select id="theme-select">
                <option value="vs-dark">Dark (VS Code)</option>
                <option value="vs">Light</option>
                <option value="hc-black">High Contrast</option>
            </select>

            <button id="run-code" class="button-primary">▶ Run Code</button>
            <button id="clear-output" class="button-danger">🗑️ Clear Output</button>
            <button id="clear-editor">Clear Editor</button>
            <button id="copy-code" class="button-success">📋 Copy Code</button>
        </div>

        <div class="editor-wrapper">
            <div id="editor"></div>

            <div class="output-panel">
                <div class="output-header">📊 Output</div>
                <div class="output-content" id="output-content">
                    <div class="output-log info">Ready to run code... Select JavaScript and click "Run Code"</div>
                </div>
            </div>
        </div>
    </div>

        require(['vs/editor/editor.main'], function() {
            /* Hide loading screen */
            document.getElementById('loading').style.display = 'none';
            document.getElementById('main-container').style.display = 'flex';

            /* Create editor */
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: codeTemplates.javascript,
                language: 'javascript',
                theme: 'vs-dark',
                fontSize: 14,
                minimap: { enabled: true },
                automaticLayout: true,
                scrollBeyondLastLine: false,
                wordWrap: 'on',
                lineNumbers: 'on',
                renderLineHighlight: 'all',
                cursorBlinking: 'smooth',
                suggestOnTriggerCharacters: true
            });

            /* Language selector */
            document.getElementById('language-select').addEventListener('change', (e) => {
                const language = e.target.value;
                const model = editor.getModel();
                monaco.editor.setModelLanguage(model, language);

                /* Load template for new language */
                if (codeTemplates[language]) {
                    editor.setValue(codeTemplates[language]);
                }
            });

            /* Theme selector */
            document.getElementById('theme-select').addEventListener('change', (e) => {
                monaco.editor.setTheme(e.target.value);
            });

            /* Run code button */
            document.getElementById('run-code').addEventListener('click', runCode);

            /* Clear editor */
            document.getElementById('clear-editor').addEventListener('click', () => {
                if (confirm('Clear all code in the editor?')) {
                    editor.setValue('');
                }
            });

            /* Clear output */
            document.getElementById('clear-output').addEventListener('click', () => {
                document.getElementById('output-content').innerHTML =
                    '<div class="output-log info">Output cleared.</div>';
            });

            /* Copy code */
            document.getElementById('copy-code').addEventListener('click', () => {
                const code = editor.getValue();
                navigator.clipboard.writeText(code).then(() => {
                    addOutput('✅ Code copied to clipboard!', 'success');
                }).catch(err => {
                    addOutput('❌ Failed to copy: ' + err.message, 'error');
                });
            });
        });

        /* Add output to panel */
        function addOutput(message, type = 'info') {
            const outputDiv = document.getElementById('output-content');
            const logDiv = document.createElement('div');
            logDiv.className = `output-log ${type}`;
            logDiv.textContent = message;
            outputDiv.appendChild(logDiv);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        /* Run code function */
        function runCode() {
            const code = editor.getValue();
            const language = document.getElementById('language-select').value;

            /* Clear previous output */
            document.getElementById('output-content').innerHTML = '';

            if (language !== 'javascript' && language !== 'typescript') {
                addOutput(`⚠️ Code execution only supports JavaScript. (Selected: ${language})`, 'error');
                addOutput('💡 Tip: Select JavaScript language to run code.', 'info');
                return;
            }

            /* Capture console output */
            const originalLog = console.log;
            const originalError = console.error;
            const originalWarn = console.warn;

            console.log = (...args) => {
                addOutput(args.join(' '), 'info');
            };

            console.error = (...args) => {
                addOutput('ERROR: ' + args.join(' '), 'error');
            };

            console.warn = (...args) => {
                addOutput('WARN: ' + args.join(' '), 'info');
            };

            try {
                addOutput('🚀 Running code...', 'success');
                const result = eval(code);

                if (result !== undefined) {
                    addOutput('Return value: ' + JSON.stringify(result), 'success');
                }

                addOutput('✅ Code executed successfully!', 'success');
            } catch (error) {
                addOutput('❌ Error: ' + error.message, 'error');
                if (error.stack) {
                    addOutput('Stack trace: ' + error.stack, 'error');
                }
            } finally {
                /* Restore console */
                console.log = originalLog;
                console.error = originalError;
                console.warn = originalWarn;
            }
        }
    </script>
</body>
