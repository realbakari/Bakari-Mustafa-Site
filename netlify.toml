[build]
  command = "bundle exec jekyll build"
  publish = "_site"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/openapi.json"
  to = "/.netlify/functions/openapi"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sermons"
  status = 200
  force = true
