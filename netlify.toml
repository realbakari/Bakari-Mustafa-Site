[build]
  command = "bundle exec jekyll build"
  publish = "_site"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/openapi.json"
  to = "/.netlify/functions/openapi"
  status = 200
  force = true

[[redirects]]
  from = "/api/radio-stream"
  to = "/.netlify/functions/radio-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sermons"
  status = 200
  force = true

# Takumi's installer: shown as text in a browser, fetched as-is by curl.
[[headers]]
  for = "/takumi/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
