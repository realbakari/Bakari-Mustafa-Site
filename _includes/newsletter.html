<div class="newsletter-subscription">
  <div class="newsletter-content">
    <div class="newsletter-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
    </div>
    <div class="newsletter-text">
      <h3 class="newsletter-title">Get updates by email</h3>
      <p class="newsletter-description">
        Receive new essays, reading notes, and project updates when they are published.
      </p>
    </div>
  </div>

  <form class="newsletter-form" action="#" method="post" id="inline-newsletter-form" data-newsletter-form data-source="inline" aria-describedby="inline-newsletter-message">
    <div class="newsletter-input-group">
      <input
        type="email"
        name="email"
        id="newsletter-email"
        class="newsletter-input"
        placeholder="Email address"
        required
        aria-label="Email address"
      >
      <button type="submit" class="newsletter-button">
        Subscribe
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
    <p class="newsletter-privacy">
      No spam, ever. Unsubscribe at any time.
    </p>
    <div id="inline-newsletter-message" class="newsletter-message" data-newsletter-message></div>
  </form>
</div>
