<div class="newsletter-subscription">

    <div class="newsletter-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>

    </div>
    <div class="newsletter-text">
      <h3 class="newsletter-title">Stay Updated</h3>
      <p class="newsletter-description">
        Get the latest posts and insights delivered directly to your inbox. Join the community!
      </p>
    </div>
  </div>

  <form class="newsletter-form" action="#" method="post" id="newsletter-form">
    <div class="newsletter-input-group">
      <input
        type="email"
        name="email"
        id="newsletter-email"
        class="newsletter-input"
        placeholder="your@email.com"
        required
        aria-label="Email address"
      >
      <button type="submit" class="newsletter-button">
        Subscribe
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
    <p class="newsletter-privacy">
      No spam, ever. Unsubscribe at any time.
    </p>
  </form>

  <div class="newsletter-success" id="newsletter-success" style="display: none;">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <h4>Thanks for subscribing!</h4>
    <p>Check your email to confirm your subscription.</p>
  </div>
</div>
