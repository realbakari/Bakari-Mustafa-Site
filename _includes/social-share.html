{% assign page_url = page.url | absolute_url | url_encode %}
{% assign page_title = page.title | url_encode %}

<div class="post-share">
  <span class="post-share-label">Share</span>
  <a href="https://twitter.com/intent/tweet?url={{ page_url }}&text={{ page_title }}&via=realbakari" target="_blank" rel="noopener noreferrer">Twitter</a>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ page_url }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  <a href="https://www.facebook.com/sharer/sharer.php?u={{ page_url }}" target="_blank" rel="noopener noreferrer">Facebook</a>
  <a href="https://wa.me/?text={{ page_title }}%20{{ page_url }}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
  <a href="https://reddit.com/submit?url={{ page_url }}&title={{ page_title }}" target="_blank" rel="noopener noreferrer">Reddit</a>
  <button type="button" class="post-share-copy" onclick="copyPostLink(this)">Copy link</button>
</div>

<script>
function copyPostLink(button) {
  navigator.clipboard.writeText(window.location.href).then(function() {
    const original = button.textContent;
    button.textContent = 'Copied!';
    setTimeout(function() {
      button.textContent = original;
    }, 2000);
  }).catch(function(err) {
    console.error('Failed to copy: ', err);
  });
}
</script>
