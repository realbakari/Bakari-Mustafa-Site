<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol class="breadcrumb-list" itemscope itemtype="https://schema.org/BreadcrumbList">
    <li class="breadcrumb-item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
      <a itemprop="item" href="{{ site.url }}">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span itemprop="name">Home</span>
      </a>
      <meta itemprop="position" content="1" />
    </li>

    {% if page.layout == "post" %}
    <li class="breadcrumb-separator" aria-hidden="true">/</li>
    <li class="breadcrumb-item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
      <a itemprop="item" href="/posts/">
        <span itemprop="name">Posts</span>
      </a>
      <meta itemprop="position" content="2" />
    </li>

    {% if page.tags and page.tags.size > 0 %}
    <li class="breadcrumb-separator" aria-hidden="true">/</li>
    <li class="breadcrumb-item" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
      <a itemprop="item" href="/tags/#{{ page.tags[0] | downcase | slugify }}">
        <span itemprop="name">{{ page.tags[0] }}</span>
      </a>
      <meta itemprop="position" content="3" />
    </li>
    {% endif %}

    <li class="breadcrumb-separator" aria-hidden="true">/</li>
    <li class="breadcrumb-item breadcrumb-current" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
      <span itemprop="name">{{ page.title | truncate: 50 }}</span>
      <meta itemprop="item" content="{{ page.url | absolute_url }}" />
      <meta itemprop="position" content="{% if page.tags and page.tags.size > 0 %}4{% else %}3{% endif %}" />
    </li>

    {% elsif page.layout == "page" %}
    <li class="breadcrumb-separator" aria-hidden="true">/</li>
    <li class="breadcrumb-item breadcrumb-current" itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
      <span itemprop="name">{{ page.title }}</span>
      <meta itemprop="item" content="{{ page.url | absolute_url }}" />
      <meta itemprop="position" content="2" />
    </li>
    {% endif %}
  </ol>
</nav>
