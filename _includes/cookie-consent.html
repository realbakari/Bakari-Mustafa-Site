<div id="cookie-consent" class="cookie-consent" style="display: none;">
  <div class="cookie-consent-content">
    <div class="cookie-consent-text">
      <p><strong>🍪 Cookie Notice</strong></p>
      <p>This website uses cookies to improve your experience and analyze traffic using Google Analytics. We respect your privacy and don't collect personal information without consent. <a href="/legal/privacy" class="cookie-link">Learn more</a></p>
    </div>
    <div class="cookie-consent-actions">
      <button id="cookie-accept" class="cookie-btn cookie-accept">Accept</button>
      <button id="cookie-decline" class="cookie-btn cookie-decline">Decline</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const COOKIE_CONSENT_KEY = 'cookie-consent';
  const banner = document.getElementById('cookie-consent');
  const acceptBtn = document.getElementById('cookie-accept');
  const declineBtn = document.getElementById('cookie-decline');

  /* Check if user has already made a choice */
  function hasConsent() {
    return localStorage.getItem(COOKIE_CONSENT_KEY) !== null;
  }

  /* Get user's consent status */
  function getConsent() {
    return localStorage.getItem(COOKIE_CONSENT_KEY) === 'true';
  }

  /* Set consent status */
  function setConsent(accepted) {
    localStorage.setItem(COOKIE_CONSENT_KEY, accepted ? 'true' : 'false');
    banner.style.display = 'none';

    /* If accepted, load Google Analytics */
    if (accepted && typeof ga !== 'undefined') {
      window['ga-disable-{{ site.google_analytics }}'] = false;
    } else if (!accepted) {
      /* Disable Google Analytics */
      window['ga-disable-{{ site.google_analytics }}'] = true;

      /* Delete existing GA cookies */
      document.cookie = '_ga=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = '_gat=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = '_gid=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    }
  }

  /* Show banner if no consent decision has been made */
  function showBannerIfNeeded() {
    if (!hasConsent()) {
      banner.style.display = 'block';
    } else if (!getConsent()) {
      /* User declined, disable analytics */
      window['ga-disable-{{ site.google_analytics }}'] = true;
    }
  }

  /* Event listeners */
  if (acceptBtn) {
    acceptBtn.addEventListener('click', function() {
      setConsent(true);
    });
  }

  if (declineBtn) {
    declineBtn.addEventListener('click', function() {
      setConsent(false);
    });
  }

  /* Show banner on page load */
  showBannerIfNeeded();
})();
</script>
