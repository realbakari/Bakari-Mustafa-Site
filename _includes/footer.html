<footer class="site-footer">
  <div class="footer-container">
    <div class="footer-content">
      <div class="footer-brand">
        <p class="footer-name">{{ site.title | default: 'Bakari Mustafa' }}</p>
        <p class="footer-tagline">{{ site.description | truncate: 80 }}</p>
      </div>

      <div class="footer-links">
        <a href="mailto:{{ site.author.email }}">Email</a>
        <a href="https://twitter.com/{{ site.twitter }}" target="_blank" rel="noopener">Twitter</a>
        <a href="https://linkedin.com/in/{{ site.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/{{ site.github }}" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="footer-copyright">
        © {{ 'now' | date: '%Y' }} {{ site.author.name }}. All rights reserved.
      </p>
    </div>
  </div>
</footer>
